<script>
   /* Mostrar Galería */
$(".img-galeria").click(function () {
    const img = this.src;
    const modelo = '<div class="modelo"><img src="' + img + '" alt="" class="img-modelo"><div class="cerrar">X</div></div>';
    
    
    $("body").append(modelo);

    /* Botón Cerrar */
    $(".cerrar").click(function () {
        $(".modelo").remove();
    });
});

/* Tecla Escape para eliminar imagen (fuera del click) */
$(document).keyup(function (e) {
    if (e.which == 27) {
        $(".modelo").remove();
    }
});

</script>
